services:

  db:
    image: postgres:15
    container_name: odoo16-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - odoo16

  odoo:
    image: odoo:16.0
    container_name: odoo16
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    networks:
      - odoo16

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: odoo16-pgadmin
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - odoo16

networks:
  odoo16:

volumes:
  postgres-data:
  odoo-data:
  pgadmin-data:
